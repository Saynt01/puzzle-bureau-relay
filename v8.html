<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Signal Relay — Operation Green-White-Green</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
  :root{
    --void:#070d1c; --navy:#0f1e3d; --navy2:#16294f;
    --gold:#d4af62; --gold-dim:#9a7a45;
    --signal:#5ee6a8; --amber:#c1791f; --flag:#128a44;
    --ink:#e8ecf5; --ink-dim:#8b96b3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--void);}
  body{
    min-height:100vh; min-height:100dvh;
    width:100%;
    font-family:'Courier New',Courier,monospace;
    color:var(--ink);
    padding:20px;
    position:relative;
    overflow-x:hidden;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(18,138,68,.09), transparent 60%),
      radial-gradient(ellipse 700px 600px at 100% 110%, rgba(212,175,98,.06), transparent 60%),
      var(--void);
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:5; opacity:.35;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px, transparent 1px, transparent 3px);
  }
  .frame{ width:100%; max-width:460px; margin:0 auto; position:relative; z-index:1; min-width:0; }
  .corner{position:absolute; width:22px; height:22px; border-color:var(--gold); border-style:solid; border-width:0; opacity:.8;}
  .corner.tl{top:-10px; left:-10px; border-top-width:2.5px; border-left-width:2.5px;}
  .corner.tr{top:-10px; right:-10px; border-top-width:2.5px; border-right-width:2.5px;}
  .corner.bl{bottom:-10px; left:-10px; border-bottom-width:2.5px; border-left-width:2.5px;}
  .corner.br{bottom:-10px; right:-10px; border-bottom-width:2.5px; border-right-width:2.5px;}

  .topline{
    display:flex; flex-wrap:wrap; gap:4px 10px; justify-content:space-between; align-items:baseline;
    font-size:10px; letter-spacing:.08em; color:var(--ink-dim); text-transform:uppercase;
    margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid rgba(212,175,98,.25);
    min-width:0;
  }
  .topline span, .topline b{min-width:0;}
  .topline b{color:var(--gold); font-weight:700;}
  .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--flag); margin-right:6px;
    box-shadow:0 0 8px var(--flag); animation:pulse 1.6s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){ .dot{animation:none;} }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .card{
    background:linear-gradient(180deg, var(--navy2), var(--navy));
    border:1px solid rgba(212,175,98,.3);
    border-radius:10px;
    padding:26px 22px 22px;
    box-shadow:0 30px 70px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
    min-height:280px;
  }

  #boot{ }
  .boot-line{font-size:13px; letter-spacing:.06em; color:var(--flag); margin-bottom:8px; opacity:0; animation:fadeIn .3s ease forwards;}
  .boot-line.b1{animation-delay:.1s;}
  .boot-line.b2{animation-delay:.6s;}
  .boot-line.b3{animation-delay:1.15s;}
  @keyframes fadeIn{to{opacity:1;}}
  .bar{height:3px; background:rgba(18,138,68,.18); border-radius:2px; overflow:hidden; margin-top:14px;}
  .bar > div{height:100%; width:0%; background:var(--flag); box-shadow:0 0 6px var(--flag); animation:fill 1.7s ease-in-out forwards; animation-delay:.1s;}
  @keyframes fill{to{width:100%;}}

  #msg{display:none;}
  .kicker{font-size:11px; letter-spacing:.22em; color:var(--amber); text-transform:uppercase; font-weight:700; margin-bottom:6px;}
  .title{
    font-family:Impact,'Arial Narrow Bold','Franklin Gothic Bold',sans-serif;
    font-weight:400; letter-spacing:.02em; text-transform:uppercase;
    font-size:clamp(24px, 7.5vw, 32px); line-height:1.05; color:#fff; margin:0 0 12px;
    text-wrap:balance; overflow-wrap:break-word;
  }
  .rule{height:1px; background:linear-gradient(90deg,var(--gold),transparent); margin:0 0 14px;}
  .body{font-size:14px; line-height:1.7; color:var(--ink);}
  .body p{margin:0 0 10px;}

  .countdown{
    margin:14px 0; padding:12px 14px; border:1.5px dashed rgba(94,230,168,.4); border-radius:8px;
    background:rgba(94,230,168,.05); text-align:center;
  }
  .countdown .label{font-size:9.5px; letter-spacing:.18em; color:var(--signal); text-transform:uppercase; margin-bottom:4px;}
  .countdown .clock{font-family:'Courier New',monospace; font-size:26px; letter-spacing:.06em; color:#fff; font-weight:700;}
  .countdown .sub{font-size:9.5px; color:var(--ink-dim); margin-top:3px;}

  .revealed-img{ margin:14px 0; border-radius:8px; overflow:hidden; border:1px solid rgba(212,175,98,.3); background:#000; }
  .revealed-img svg{ display:block; width:100%; height:auto; }
  .img-cap{font-size:9.5px; color:var(--ink-dim); letter-spacing:.05em; text-align:center; margin-top:5px; text-transform:uppercase;}

  .sig{font-size:12.5px; color:var(--ink-dim); margin-top:6px;}
  .filebar{
    margin-top:18px; padding-top:12px; border-top:1px dashed rgba(212,175,98,.25);
    display:flex; flex-wrap:wrap; gap:4px 10px; justify-content:space-between;
    font-size:10px; letter-spacing:.06em; color:var(--ink-dim); text-transform:uppercase;
    min-width:0;
  }
  .filebar b{color:var(--gold-dim);}

  .foot{
    text-align:center; margin-top:16px; font-size:10px; letter-spacing:.06em; color:var(--ink-dim); text-transform:uppercase;
    padding:0 6px;
  }
  .foot b{color:var(--gold-dim);}
</style>
</head>
<body>
<div class="frame">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="topline"><span><span class="dot"></span>CHANNEL 8</span><b>NIGHTJAR BUREAU · SIGNAL RELAY</b></div>
  <div class="card">
    <div id="gate" style="text-align:center; padding:18px 4px;">
      <svg width="46" height="46" viewBox="0 0 100 100" style="margin-bottom:10px; opacity:.85;">
        <polygon points="50,4 61,38 97,38 68,59 79,94 50,73 21,94 32,59 3,38 39,38" fill="none" stroke="#d4af62" stroke-width="5"/>
      </svg>
      <div class="kicker" style="margin-bottom:8px;">INCOMING TRANSMISSION</div>
      <div style="font-size:13px; color:var(--ink-dim); margin-bottom:18px; line-height:1.6;">A signal is waiting. Tap to decrypt it.</div>
      <button id="gate-btn" style="font-family:'Bebas Neue',sans-serif; letter-spacing:.14em; font-size:18px; color:var(--void); background:var(--signal); border:none; border-radius:6px; padding:12px 28px; cursor:pointer; box-shadow:0 0 16px rgba(94,230,168,.4);">TAP TO DECRYPT</button>
    </div>
    <div id="boot" style="display:none;">
      <div class="boot-line b1">&gt; establishing uplink&hellip;</div>
      <div class="boot-line b2">&gt; verifying agent proximity&hellip;</div>
      <div class="boot-line b3">&gt; decrypting transmission&hellip;</div>
      <div class="bar"><div></div></div>
    </div>
    <div id="msg">
      <div class="kicker" id="m-kicker">TRANSMISSION RECEIVED</div>
      <div class="title" id="m-title">SIGNAL LOCKED</div>
      <div class="rule"></div>
      <div id="m-countdown"></div>
      <div id="m-image"></div>
      <div class="body" id="m-body"></div>
      <div class="filebar"><span>CASE: <b id="m-case">01</b></span><span id="m-time"></span></div>
    </div>
    <audio id="sfx-typing" src="sfx/typing.mp3" preload="auto"></audio>
    <audio id="sfx-chime" src="sfx/chime.mp3" preload="auto"></audio>
  </div>
  <div class="foot">Volume 8 &middot; <b>Operation Green-White-Green</b> &middot; The Puzzle Bureau</div>
</div>

<script>
(function(){
  var TOWER_SVG = '<svg viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg" style="background:linear-gradient(180deg,#1a2440,#0b1830);">' +
    '<polygon points="150,14 165,150 135,150" fill="none" stroke="#8a94a8" stroke-width="2"/>' +
    '<line x1="139" y1="58" x2="161" y2="58" stroke="#8a94a8" stroke-width="1.5"/>' +
    '<line x1="137" y1="92" x2="163" y2="92" stroke="#8a94a8" stroke-width="1.5"/>' +
    '<line x1="135" y1="126" x2="165" y2="126" stroke="#8a94a8" stroke-width="1.5"/>' +
    '<circle cx="150" cy="10" r="4" fill="#ffcf4d"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>' +
    '<rect x="60" y="150" width="180" height="10" fill="#12213e"/>' +
    '<text x="150" y="164" font-size="7" fill="#8b96b3" text-anchor="middle" font-family="monospace" letter-spacing="1">CAM 04 &middot; KANO OUTSKIRTS</text></svg>';
  var BADGE_SVG = '<svg viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg" style="background:#0b1830;">' +
    '<rect x="90" y="25" width="120" height="120" rx="10" fill="#0f1e3d" stroke="#128a44" stroke-width="2.5"/>' +
    '<polygon points="150,50 158,72 182,72 163,86 170,108 150,95 130,108 137,86 118,72 142,72" fill="none" stroke="#d4af62" stroke-width="2.5"/>' +
    '<text x="150" y="128" font-size="10" fill="#fff" text-anchor="middle" font-family="monospace" letter-spacing="1">AGENT DELTA</text>' +
    '<text x="150" y="140" font-size="7" fill="#8b96b3" text-anchor="middle" font-family="monospace" letter-spacing="1">COVER ID — ACTIVE</text></svg>';
  var CLOSED_SVG = '<svg viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg" style="background:#0b1830;">' +
    '<circle cx="150" cy="85" r="55" fill="none" stroke="#128a44" stroke-width="3"/>' +
    '<text x="150" y="80" font-size="16" fill="#5ee6a8" text-anchor="middle" font-family="monospace" font-weight="bold">CASE</text>' +
    '<text x="150" y="100" font-size="16" fill="#5ee6a8" text-anchor="middle" font-family="monospace" font-weight="bold">CLOSED</text></svg>';

  var DATA = {
    case1: {
      kicker: 'TRANSMISSION RECEIVED — CHANNEL 8',
      title: 'MISSION LIVE',
      case: '01',
      countdown: { seconds: 300, label: 'TRANSMISSION WINDOW' },
      image: { svg: BADGE_SVG, caption: 'Cover ID Confirmed — Agent Delta' },
      body: [
        "Agent Delta, this is Compass. You're clear to move.",
        "Find Agent Eko in Lagos and follow her lead. Everything from here runs city to city — stay sharp.",
        "Operation Green-White-Green is live."
      ],
      sig: '— Agent Compass'
    },
    case6: {
      kicker: 'PRIORITY BULLETIN — CHANNEL 8',
      title: 'EYES ON KANO',
      case: '06',
      image: { svg: TOWER_SVG, caption: 'Decommissioned Relay Tower — Flagged for Follow-Up' },
      body: [
        "Before you leave Abuja — a drone pass over Kano just flagged something.",
        "An old relay tower, marked decommissioned on every record we have. Except the power's still on.",
        "Keep it in mind, Agent."
      ],
      sig: '— Agent Compass'
    },
    final: {
      kicker: 'CASE CLOSED — CHANNEL 8',
      title: 'OUTSTANDING WORK',
      case: '13',
      image: { svg: CLOSED_SVG, caption: 'Operation Green-White-Green — Resolved' },
      body: [
        "Four cities, twelve cases, and it all came down to one report nobody opened.",
        "The backdoor's already being patched at all three sites. Dr. Bello's original report is finally being read.",
        "Operation Green-White-Green, this case is closed. Nice work, Agent Delta."
      ],
      sig: '— Agent Compass'
    }
  };

  function typewrite(el, lines, cb){
    el.innerHTML = '';
    var li = 0;
    function nextLine(){
      if(li >= lines.length){ if(cb) cb(); return; }
      var p = document.createElement('p');
      el.appendChild(p);
      var text = lines[li];
      var ci = 0;
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(reduced){ p.textContent = text; li++; nextLine(); return; }
      (function tick(){
        p.textContent = text.slice(0, ci) + (ci < text.length ? '▌' : '');
        ci++;
        if(ci <= text.length){ setTimeout(tick, 14); }
        else { p.textContent = text; li++; setTimeout(nextLine, 220); }
      })();
    }
    nextLine();
  }

  function runCountdown(el, seconds, label){
    el.innerHTML = '<div class="countdown"><div class="label">' + label + '</div><div class="clock" id="clockval"></div><div class="sub">Cosmetic only — closes and reopens on refresh</div></div>';
    var clockEl = document.getElementById('clockval');
    var remaining = seconds;
    function render(){
      var m = Math.floor(remaining/60), s = remaining%60;
      clockEl.textContent = (m<10?'0':'')+m + ':' + (s<10?'0':'')+s;
    }
    render();
    var iv = setInterval(function(){
      remaining--;
      if(remaining < 0){ clearInterval(iv); clockEl.textContent = 'EXPIRED'; return; }
      render();
    }, 1000);
  }

  function playSfx(id){
    var el = document.getElementById(id);
    if (!el) return;
    try {
      el.currentTime = 0;
      var p = el.play();
      if (p && p.catch) p.catch(function(){ /* autoplay blocked — silent is fine */ });
    } catch(e) { /* ignore */ }
  }

  function boot(){
    var hash = (location.hash || '').replace('#','').trim();
    var d = DATA[hash] || DATA.case1;

    document.getElementById('m-kicker').textContent = d.kicker;
    document.getElementById('m-title').textContent = d.title;
    document.getElementById('m-case').textContent = d.case;
    var now = new Date();
    document.getElementById('m-time').textContent = now.toLocaleDateString(undefined,{month:'short',day:'numeric'});

    if (d.image) {
      document.getElementById('m-image').innerHTML = '<div class="revealed-img">' + d.image.svg + '</div><div class="img-cap">' + d.image.caption + '</div>';
    }

    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var delay = reduced ? 0 : 1700;
    if (!reduced) playSfx('sfx-typing');
    setTimeout(function(){
      document.getElementById('boot').style.display = 'none';
      var msg = document.getElementById('msg');
      msg.style.display = 'block';
      playSfx('sfx-chime');
      if (d.countdown) runCountdown(document.getElementById('m-countdown'), d.countdown.seconds, d.countdown.label);
      typewrite(document.getElementById('m-body'), d.body);
    }, delay);
  }
  function unlockAudio(){
    ['sfx-typing','sfx-chime'].forEach(function(id){
      var el = document.getElementById(id);
      if(!el) return;
      var p;
      try { p = el.play(); } catch(e) { return; }
      if (p && p.then) {
        p.then(function(){ el.pause(); el.currentTime = 0; }).catch(function(){});
      }
    });
  }

  document.getElementById('gate-btn').addEventListener('click', function(){
    unlockAudio();
    document.getElementById('gate').style.display = 'none';
    document.getElementById('boot').style.display = 'block';
    boot();
  });
  window.addEventListener('hashchange', function(){ location.reload(); });
})();
</script>
</body>
</html>
